name: Azure Static Web Apps CI/CD (Gentle Moss)

# Momoney uses Azure Static Web Apps Standard (verified October 3, 2026).
# This workflow deploys only the frontend. Deploy and link the protected storage
# Function App separately; see api/README.md. Keep api_location empty for a linked backend.
# See: https://learn.microsoft.com/en-us/azure/static-web-apps/plans

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main ]
  workflow_dispatch:

# Avoid overlapping deploys on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Faster checkout
          lfs: false

      # Use optimized Azure SWA action with custom build settings
      # No managed API deployment; the app uses built-in auth providers.
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        env:
          REACT_APP_SKIP_AUTH: "false"
          REACT_APP_AI_ENABLED: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          REACT_APP_AZURE_OPENAI_DEPLOYMENT: "gpt-5.4-mini"
          # SWA linked APIs are not available in pull-request preview environments.
          REACT_APP_CLOUD_SYNC_ENABLED: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_MOSS_087D9321E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          api_location: ""
          output_location: "build"
          production_branch: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'main' }}
          # Custom optimized build command
          app_build_command: |
            npm ci --prefer-offline --no-audit --no-fund --ignore-scripts --omit=optional && \
            CI=true GENERATE_SOURCEMAP=false npm run build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GENTLE_MOSS_087D9321E }}
          action: close
